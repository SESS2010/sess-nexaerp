# DESKTOP-SPF5420 only; see mandatory server boundaries. No SDK, no NI/Siemens changes.
db=postgres
db-url=jdbc:postgresql://127.0.0.1:5432/sess_keycloak
db-username=sess_keycloak
db-password=REPLACE_LOCALLY_WITH_PROTECTED_SECRET
db-pool-initial-size=1
db-pool-min-size=1
db-pool-max-size=10
hostname=https://192.168.68.130:8444
hostname-strict=true
http-enabled=false
https-port=8444
https-certificate-file=C:/SESS-Identity/tls/keycloak.crt
https-certificate-key-file=C:/SESS-Identity/tls/keycloak.key
health-enabled=true
metrics-enabled=true
http-management-host=127.0.0.1
http-management-port=9000
http-management-scheme=http
cache=local
log=console,file
log-file=C:/SESS-Identity/logs/keycloak.log
log-file-rotation-max-file-size=10M
log-file-rotation-max-backup-index=5
