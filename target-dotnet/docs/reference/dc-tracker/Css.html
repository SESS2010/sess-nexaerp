<style>
:root{
  --bg:#f3f5f8; --surface:#fff; --surface2:#f8fafc; --ink:#14213d; --ink2:#4a5568; --muted:#8391a7; --line:#e3e8ef;
  --brand:#1f3a5f; --brand2:#2d5a8e; --accent:#0e8f7e; --accentSoft:#e3f5f2;
  --red:#c62828; --redSoft:#fdecec; --amber:#b26a00; --amberSoft:#fff4e0; --green:#1b7f3b; --greenSoft:#e6f5ea;
  --blue:#1f5fbf; --blueSoft:#e8f0fc; --violet:#6b3fb5; --violetSoft:#f1ebfb; --gray:#667085; --graySoft:#eef0f3;
  --radius:10px; --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
a{color:var(--brand2);text-decoration:none} a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em} h1{font-size:20px} h2{font-size:16px} h3{font-size:14px}
.muted{color:var(--muted)} .small{font-size:12px} .nowrap{white-space:nowrap} .right{text-align:right} .center{text-align:center}
.hidden{display:none!important} .grow{flex:1} .mt{margin-top:14px} .mb{margin-bottom:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#bar{position:fixed;top:0;left:0;height:3px;width:0;background:var(--accent);z-index:999;transition:width .3s}
#bar.on{width:70%;transition:width 8s cubic-bezier(.1,.7,.2,1)}

/* ---------- login */
.login{min-height:100vh;display:grid;place-items:center;padding:16px;background:linear-gradient(160deg,#1f3a5f 0%,#2d5a8e 55%,#0e8f7e 100%)}
.login .card{width:100%;max-width:380px;padding:28px}
.login .logo{width:46px;height:46px;border-radius:12px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700;margin-bottom:14px}

/* ---------- shell */
.shell{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.side{background:var(--brand);color:#dce6f2;padding:14px 10px;position:sticky;top:0;height:100vh;overflow:auto}
.side .brand{display:flex;gap:10px;align-items:center;padding:4px 8px 16px;color:#fff}
.side .brand b{font-size:15px} .side .brand small{display:block;color:#9fb3cc;font-size:11px}
.side .mark{width:34px;height:34px;border-radius:9px;background:var(--accent);display:grid;place-items:center;font-weight:700;color:#fff}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:#dce6f2;margin:1px 0;cursor:pointer}
.nav a:hover{background:rgba(255,255,255,.08);text-decoration:none}
.nav a.on{background:rgba(255,255,255,.16);color:#fff;font-weight:600}
.nav .sep{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:#7f97b5;padding:14px 10px 4px}
.nav .cnt{margin-left:auto;background:var(--red);color:#fff;border-radius:10px;font-size:11px;padding:0 7px;font-weight:600}
.sidefoot{display:none;margin:16px 8px 0;padding-top:12px;border-top:1px solid rgba(255,255,255,.15);color:#fff;font-size:13px}
.sidefoot small{color:#9fb3cc} .sidefoot a{color:#cfe0f5;cursor:pointer;text-decoration:underline}
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top .who{margin-left:auto;text-align:right;line-height:1.2} .top .who small{color:var(--muted)}
.burger{display:none;border:0;background:none;font-size:22px;cursor:pointer;padding:2px 6px}
.content{padding:20px;max-width:1400px;width:100%}
.pagehead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.pagehead .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

/* ---------- cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;min-width:0}
.card>h2,.card>h3{margin-bottom:10px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--brand2);border-radius:var(--radius);padding:12px 14px;cursor:pointer;box-shadow:var(--shadow);transition:transform .1s}
.kpi:hover{transform:translateY(-1px)}
.kpi .v{font-size:26px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .l{font-size:12.5px;color:var(--ink2);margin-top:2px} .kpi .s{font-size:11.5px;color:var(--muted)}
.kpi.red{border-left-color:var(--red)} .kpi.red .v{color:var(--red)}
.kpi.amber{border-left-color:var(--amber)} .kpi.amber .v{color:var(--amber)}
.kpi.green{border-left-color:var(--green)} .kpi.violet{border-left-color:var(--violet)} .kpi.teal{border-left-color:var(--accent)}
.chartbox{position:relative;height:260px}

/* ---------- buttons & forms */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:7px 13px;border-radius:8px;cursor:pointer;font-weight:550;white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff} .btn.primary:hover{background:var(--brand2)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--red);border-color:#f3c4c4} .btn.danger:hover{background:var(--redSoft)}
.btn.sm{padding:4px 9px;font-size:12.5px} .btn:disabled{opacity:.5;cursor:not-allowed}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--ink2);font-weight:550;min-width:0}
label.f .req{color:var(--red)}
input.i,select.i,textarea.i{width:100%;border:1px solid #cfd7e3;border-radius:8px;padding:8px 10px;background:#fff;font-size:14px;min-width:0}
input.i:focus,select.i:focus,textarea.i:focus{outline:2px solid #bcd3f5;border-color:var(--brand2)}
textarea.i{min-height:64px;resize:vertical}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.fgrid .span2{grid-column:span 2} .fgrid .spanall{grid-column:1/-1}
fieldset{border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin:0 0 14px;background:var(--surface)}
legend{font-weight:650;padding:0 6px;color:var(--brand)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:8px 14px;cursor:pointer;font-weight:550;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0} .seg button.on{background:var(--brand);color:#fff}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:12px;overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 12px;cursor:pointer;border-bottom:2px solid transparent;color:var(--ink2);font-weight:550;white-space:nowrap}
.tabs button.on{border-bottom-color:var(--brand);color:var(--brand)}
.filters{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:12px}

/* ---------- tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{position:sticky;top:0;background:var(--surface2);text-align:left;font-weight:600;color:var(--ink2);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:12px}
table.t td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.t tr:last-child td{border-bottom:0}
table.t tr.click{cursor:pointer} table.t tr.click:hover td{background:#f5f8fc}
table.t td.num,table.t th.num{text-align:right;font-variant-numeric:tabular-nums}
table.t input.i{padding:5px 7px;font-size:13px}
.ellip{max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- badges */
.b{display:inline-block;padding:1px 8px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap;line-height:1.6}
.b.red{background:var(--redSoft);color:var(--red)} .b.amber{background:var(--amberSoft);color:var(--amber)}
.b.green{background:var(--greenSoft);color:var(--green)} .b.blue{background:var(--blueSoft);color:var(--blue)}
.b.violet{background:var(--violetSoft);color:var(--violet)} .b.gray{background:var(--graySoft);color:var(--gray)}
.b.teal{background:var(--accentSoft);color:var(--accent)}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
.chip{font-size:10.5px;padding:0 6px;border-radius:4px;background:var(--graySoft);color:var(--ink2);white-space:nowrap}
.chip.red{background:var(--redSoft);color:var(--red)} .chip.amber{background:var(--amberSoft);color:var(--amber)} .chip.violet{background:var(--violetSoft);color:var(--violet)}

/* ---------- detail */
.dl{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px 18px}
.dl div span{display:block;font-size:11.5px;color:var(--muted)} .dl div b{font-weight:550;word-break:break-word}
.progress{height:8px;background:var(--graySoft);border-radius:6px;overflow:hidden;display:flex}
.progress i{display:block;height:100%}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.alert{padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:12px}
.alert.red{background:var(--redSoft);color:#8a1c1c} .alert.amber{background:var(--amberSoft);color:#7a4a00} .alert.blue{background:var(--blueSoft);color:#1b437f} .alert.green{background:var(--greenSoft);color:#14532d}
.empty{padding:28px;text-align:center;color:var(--muted)}
.ack{border:1px dashed var(--accent);background:var(--accentSoft);border-radius:var(--radius);padding:14px}

/* ---------- modal & toast */
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 12px;z-index:100;overflow:auto}
.modal{background:var(--surface);border-radius:12px;width:100%;max-width:560px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal.wide{max-width:900px} .modal.xwide{max-width:1000px}
.modal .mh{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal .mh .x{margin-left:auto;border:0;background:none;font-size:22px;cursor:pointer;color:var(--muted);line-height:1}
.modal .mb{padding:16px 18px;max-height:calc(100vh - 200px);overflow:auto}
.modal .mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center}
#toast div{background:#1d2939;color:#fff;padding:10px 16px;border-radius:8px;box-shadow:var(--shadow);max-width:90vw}
#toast div.err{background:var(--red)} #toast div.ok{background:var(--green)}
.dcpreview{background:#e9edf2;padding:16px;border-radius:8px;overflow:auto}
.dcpreview>div{box-shadow:0 2px 8px rgba(0,0,0,.15);padding:14px!important}

/* ---------- print */
#printArea{display:none}
@media print{
  @page{size:A4;margin:10mm}
  body{background:#fff}
  body.printing #app,body.printing #modalRoot,body.printing #toast,body.printing #bar{display:none!important}
  body.printing #printArea{display:block}
  .report-print table{page-break-inside:auto} .report-print tr{page-break-inside:avoid}
}

/* ---------- responsive */
@media (max-width:1100px){.g3{grid-template-columns:1fr 1fr}}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:250px;z-index:60;transform:translateX(-100%);transition:transform .2s}
  .side.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.35)}
  .burger{display:block}
  .content{padding:14px 16px}
  .top{padding:8px 16px}
  .g2,.g3{grid-template-columns:1fr}
  .fgrid .span2{grid-column:auto}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi .v{font-size:22px}
  .modal-bg{padding:0}
  .modal{border-radius:0;min-height:100vh;max-width:none!important}
  .modal .mb{max-height:none}
  .top .who,#pwBtn,#outBtn{display:none}
  #coSel{max-width:150px!important;margin-left:auto;padding:6px 8px;font-size:13px}
  .top h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sidefoot{display:block}
}
</style>
